[package]
name = "herdr-deck-bridge"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
publish.workspace = true
description = "Host daemon: herdr and Claude Code on one side, the herdr-deck panel on the other"

# What you type: `herdr-deck install`, `herdr-deck deploy`, `herdr-deck doctor`.
[[bin]]
name = "herdr-deck"
path = "src/main.rs"

[dependencies]
libc = "0.2"
# The USB cable: pure Rust, no libusb and no system package.
nusb = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
herdr-deck-render = { path = "../herdr-deck-render" }
herdr-deck-proto = { path = "../herdr-deck-proto" }
